<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Direct Video Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* Tinatanggal ang itim na background gamit ang CSS Blend Mode */
            mix-blend-mode: screen; 
        }
    </style>
</head>
<body>

    <video id="myVideo" autoplay loop muted playsinline crossorigin="anonymous">
        <source src="https://files.catbox.moe/fa0im4.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <script>
        const video = document.getElementById('myVideo');
        
        // Piliting mag-play sakaling harangin ng browser autoplay policy
        document.addEventListener('click', () => {
            video.play();
        });

        window.addEventListener('load', () => {
            video.play().catch(error => {
                console.log("Autoplay waiting for interaction or OBS load");
            });
        });
    </script>
</body>
</html>
